# SSM
name: GitOps SSM CICD Pipeline
on:
  push:
    branches:
    - main
jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4
    
    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    - name: S3에서 프라이빗으로 배포
      run: |
        aws s3 sync html/ s3://std08-v1-bucket/ --delete
        aws ssm send-command \
          --instance-ids "i-098c52d8121bddab5" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            \"sudo aws s3 sync s3://std08-v1-bucket/ /usr/share/nginx/html/ --delete\",
            \"sudo chown -R ec2-user:nginx /usr/share/nginx/html\",
            \"sudo systemctl reload nginx\"
          ]" \
          --region ${{secrets.AWS_REGION}} \
          --comment "Deploying SSM"